<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Shelfwise</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/style.css" rel="stylesheet"></head><body class="d-flex align-items-center justify-content-center min-vh-100"><div class="card panel p-4" style="width:min(430px,92vw)"><div class="h3 mb-1">📚 Shelfwise</div><p class="text-secondary mb-4">Sign in to your library account</p>{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}<form method="post" action="/login"><label class="form-label" for="email">Email</label><input id="email" class="form-control mb-3" type="email" name="email" autocomplete="username" required autofocus><label class="form-label" for="password">Password</label><input id="password" class="form-control mb-4" type="password" name="password" autocomplete="current-password" required><button class="btn btn-primary w-100">Sign in</button></form><small class="text-secondary mt-4">Demo credentials are listed in the README.</small></div></body></html>
