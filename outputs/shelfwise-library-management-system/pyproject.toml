[project]
name = "library-management-system"
version = "1.0.0"
description = "A practical library circulation and collection management system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "jinja2>=3.1,<4", "python-multipart>=0.0.9",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.8,<3", "pydantic-settings>=2.4,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
