<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · WCBT Library</title>
    <meta name="description" content="Sign in to manage your WCBT Library account, books, and loans.">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="login-page d-flex align-items-center justify-content-center">
    <main class="card panel login-card">
        <a class="brand mb-1 justify-content-center" href="/" aria-label="WCBT Library"><span class="brand-logo-frame login-logo-frame"><img class="brand-logo" src="/static/wcbt-logo.png" alt="WCBT · Learn, Innovate, Lead"></span></a>
        <h1 class="h4 text-center mb-2">Welcome back</h1>
        <p class="text-secondary text-center mb-4">Sign in to your library account</p>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control mb-3" type="email" name="email" autocomplete="username" required autofocus>

            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-control mb-4" type="password" name="password" autocomplete="current-password" required>

            <button class="btn btn-primary w-100">Sign in</button>
        </form>
    </main>
</body>
</html>
