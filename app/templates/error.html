<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The requested WCBT Library page could not be found.">
    <meta name="theme-color" content="#880b2f">
    <title>{{ title }} · WCBT Library</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="d-flex min-vh-100">
    <main class="error-page my-auto">
        <a href="/login" aria-label="WCBT Library home"><img src="/static/wcbt-logo-circle.png" alt="WCBT Library" class="mb-4" style="width:min(220px,55vw)"></a>
        <h1 class="display-5">{{ title }}</h1>
        <p class="text-secondary">{{ message }}</p>
        <a class="btn btn-primary" href="/">Return to library</a>
    </main>
</body>
</html>
